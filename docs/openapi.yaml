    post: { operationId: transitionDeal, summary: Move an open deal with an optimistic version, responses: { '200': { description: Transition applied }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '409': { description: Current version or stage changed }, '419': { $ref: '#/components/responses/CsrfFailure' }, '422': { $ref: '#/components/responses/ValidationFailure' } } }
