    post: { operationId: createSalesTask, summary: Create a task for exactly one customer or deal, responses: { '201': { description: Task created }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '419': { $ref: '#/components/responses/CsrfFailure' }, '422': { $ref: '#/components/responses/ValidationFailure' } } }
  /company/tasks/{task}/complete:
    post: { operationId: completeSalesTask, summary: Mark a tenant-bound task complete, responses: { '200': { description: Task completed }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '419': { $ref: '#/components/responses/CsrfFailure' } } }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: daleel-crm-api-session
      description: HttpOnly server-side session cookie. Use Sanctum CSRF bootstrap for state-changing requests.
  headers:
    SessionCookie:
      description: Host-only, HttpOnly, SameSite=Lax session cookie; Secure is enabled outside local HTTP.
      schema: { type: string }
  schemas:
    Meta:
      type: object
      required: [request_id]
      properties:
        request_id: { type: string, format: uuid }
    SuccessEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { type: object }
        meta: { $ref: '#/components/schemas/Meta' }
    Identity:
      type: object
      required: [id, email, email_verified_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        email_verified_at: { type: [string, 'null'], format: date-time }
    IdentityEnvelope:
      type: object
      required: [data, meta]
      properties:
        data: { $ref: '#/components/schemas/Identity' }
        meta: { $ref: '#/components/schemas/Meta' }
    CompanyContextEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: object
          required: [company, membership]
          properties:
            company:
              type: object
              required: [id, display_name, slug, timezone, default_locale]
              properties:
                id: { type: string, format: uuid }
                display_name: { type: string }
                slug: { type: string }
                timezone: { type: string }
                default_locale: { type: string }
            membership:
              type: object
              required: [id, status]
              properties:
                id: { type: string, format: uuid }
                status: { type: string, enum: [ACTIVE] }
        meta: { $ref: '#/components/schemas/Meta' }
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
        meta: { $ref: '#/components/schemas/Meta' }
    CustomerInput:
      type: object
      required: [type, display_name]
      properties:
        type: { type: string, enum: [PERSON, ORGANIZATION] }
        display_name: { type: string, maxLength: 160 }
        legal_name: { type: [string, 'null'], maxLength: 200 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        country_code: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
    ContactInput:
      type: object
      required: [display_name]
      properties:
        display_name: { type: string, maxLength: 160 }
        email: { type: [string, 'null'], format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 32 }
        job_title: { type: [string, 'null'], maxLength: 120 }
        note: { type: [string, 'null'], maxLength: 1000 }
        is_primary: { type: boolean }
    AddressInput:
      type: object
      required: [line1]
      properties:
        kind: { type: string, enum: [GENERAL, BILLING, SHIPPING] }
        line1: { type: string, maxLength: 200 }
        line2: { type: [string, 'null'], maxLength: 200 }
        city: { type: [string, 'null'], maxLength: 100 }
        region: { type: [string, 'null'], maxLength: 100 }
        postal_code: { type: [string, 'null'], maxLength: 32 }
        country_code: { type: [string, 'null'], pattern: '^[A-Z]{2}$' }
  responses:
    CustomerSuccess:
      description: Customer, contact, address, or conversion response in the standard envelope.
      content: { application/json: { schema: { $ref: '#/components/schemas/SuccessEnvelope' } } }
    Forbidden:
      description: The current tenant-staff context lacks the required permission.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: The requested resource is unavailable in the current tenant.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    AuthInvalidCredentials:
      description: Email or password is incorrect.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Unauthenticated:
      description: Authentication is required or the session was revoked.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    CsrfFailure:
      description: CSRF token is missing or invalid.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    ValidationFailure:
      description: Request validation failed.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    AuthRateLimit:
      description: Authentication-specific request limit was exceeded.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
