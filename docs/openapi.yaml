      parameters: [ { in: path, name: customer, required: true, schema: { type: string, format: uuid } }, { in: path, name: contact, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ContactInput' } } } }
      responses: { '200': { $ref: '#/components/responses/CustomerSuccess' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '419': { $ref: '#/components/responses/CsrfFailure' }, '422': { $ref: '#/components/responses/ValidationFailure' } }
  /company/customers/{customer}/addresses/{address}:
    patch:
      operationId: updateCustomerAddress
      summary: Update an address under a current-tenant customer
      parameters: [ { in: path, name: customer, required: true, schema: { type: string, format: uuid } }, { in: path, name: address, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } } }
      responses: { '200': { $ref: '#/components/responses/CustomerSuccess' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '419': { $ref: '#/components/responses/CsrfFailure' }, '422': { $ref: '#/components/responses/ValidationFailure' } }
  /company/leads/{lead}/convert:
    post:
      operationId: convertLeadToCustomer
      summary: Convert a lead once without changing its pipeline stage or creating a deal
      parameters: [ { in: path, name: lead, required: true, schema: { type: string, format: uuid } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [customer], properties: { customer: { $ref: '#/components/schemas/CustomerInput' }, contact: { $ref: '#/components/schemas/ContactInput' } } } } } }
      responses: { '201': { $ref: '#/components/responses/CustomerSuccess' }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: Existing conversion or tenant-local duplicate candidate; no automatic merge. }, '419': { $ref: '#/components/responses/CsrfFailure' }, '422': { $ref: '#/components/responses/ValidationFailure' } }
  /company/pipelines:
    get: { operationId: listSalesPipelines, summary: List current-tenant sales pipelines and stages, responses: { '200': { description: Pipeline list }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post: { operationId: createSalesPipeline, summary: Create a current-tenant pipeline, responses: { '201': { description: Pipeline created }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '419': { $ref: '#/components/responses/CsrfFailure' }, '422': { $ref: '#/components/responses/ValidationFailure' } } }
  /company/deals:
