    post: { operationId: createDeal, summary: Create a tenant-bound deal, responses: { '201': { description: Deal created }, '401': { $ref: '#/components/responses/Unauthenticated' }, '403': { $ref: '#/components/responses/Forbidden' }, '419': { $ref: '#/components/responses/CsrfFailure' }, '422': { $ref: '#/components/responses/ValidationFailure' } } }
